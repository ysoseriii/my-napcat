name: 每日自动启动 NapCat 发消息

on:
  schedule:
    # 每 2 小时触发一次，由脚本判断是否在窗口内
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 判断窗口并启动
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # 获取北京时间的小时
          BJ_HOUR=$(TZ='Asia/Shanghai' date +%H)
          echo "北京时间: $(TZ='Asia/Shanghai' date)"

          BJ_MIN=$(TZ='Asia/Shanghai' date +%M)
          # 北京时间 6:00 ~ 8:03
          if [ "$BJ_HOUR" -eq 6 ] || [ "$BJ_HOUR" -eq 7 ] || { [ "$BJ_HOUR" -eq 8 ] && [ "$BJ_MIN" -le 3 ]; }; then
            echo "在窗口内 (6:00-8:03)，启动机器..."
            MACHINES_JSON=$(flyctl m list --app my-napcat --json 2>/dev/null)
            STOPPED=$(echo "$MACHINES_JSON" | python3 -c "import json,sys; print(' '.join(m['id'] for m in json.load(sys.stdin) if m['state']=='stopped'))" 2>/dev/null)
            if [ -n "$STOPPED" ]; then
              echo "启动: $STOPPED"
              flyctl m start $STOPPED --app my-napcat
            else
              echo "机器已在运行或无机器"
            fi
          else
            echo "不在窗口内 (北京时间 ${BJ_HOUR}:${BJ_MIN})，跳过"
          fi
